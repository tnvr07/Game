<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Sunstone Trail</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Courier New", monospace;
      background: #101820;
      color: #f4edcc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at center, #233b43 0%, #101820 72%);
    }

    main { width: min(100%, 760px); }

    h1 {
      margin: 0 0 12px;
      color: #f2ca70;
      font-size: clamp(1.25rem, 5vw, 2rem);
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }

    .frame {
      padding: 10px;
      border: 4px solid #718277;
      background: #1a292a;
      box-shadow: 0 12px 40px #0008, inset 0 0 0 3px #344743;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #315b4b;
      image-rendering: pixelated;
    }

    .help {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      margin: 12px 0 0;
      color: #c7d1bb;
      font-size: .85rem;
      line-height: 1.5;
      text-align: center;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid #718277;
      border-radius: 3px;
      background: #263634;
      color: #f2ca70;
      font: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>The Sunstone Trail</h1>
    <div class="frame">
      <canvas id="game" width="640" height="360" aria-label="The Sunstone Trail action RPG"></canvas>
    </div>
    <p class="help">
      <span><kbd>WASD</kbd>/<kbd>←↑↓→</kbd> Move</span>
      <span><kbd>Z</kbd>/<kbd>Space</kbd> Pulse attack</span>
      <span><kbd>E</kbd> Talk / interact</span>
      <span><kbd>Enter</kbd> Start / retry</span>
    </p>
  </main>
  <script>
    "use strict";

    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const tile = 32;
    const world = { width: 44, height: 22 };
    const keys = new Set();
    const obstacles = [
      [3, 5], [4, 5], [10, 4], [11, 4], [12, 5], [16, 6], [17, 6],
      [24, 4], [25, 4], [30, 6], [31, 6], [34, 4], [35, 4], [40, 5],
      [5, 17], [6, 17], [12, 16], [13, 16], [19, 18], [20, 18],
      [26, 16], [27, 16], [33, 18], [34, 18], [39, 16], [40, 16]
    ];
    const blocked = new Set(obstacles.map(([x, y]) => `${x},${y}`));
    const player = {
      x: 5.5 * tile, y: 11 * tile, direction: "right",
      hp: 6, attack: 0, hurt: 0
    };
    const guide = { x: 8.5 * tile, y: 11 * tile };
    const relic = { x: 38 * tile, y: 11 * tile };
    const enemies = [];
    let camera = { x: 0, y: 0 };
    let mode = "title";
    let questStage = 0;
    let message = "";
    let messageTimer = 0;
    let lastTime = 0;

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) event.preventDefault();
      keys.add(key);
      if (key === "enter" && (mode === "title" || mode === "lost" || mode === "won")) startGame();
      if (mode === "playing" && key === "e" && !event.repeat) interact();
      if (mode === "playing" && (key === "z" || key === " ") && !event.repeat) attack();
    });
    window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
    window.addEventListener("blur", () => keys.clear());

    function startGame() {
      player.x = 5.5 * tile;
      player.y = 11 * tile;
      player.direction = "right";
      player.hp = 6;
      player.attack = 0;
      player.hurt = 0;
      enemies.splice(0, enemies.length,
        { x: 16 * tile, y: 11 * tile, hp: 2, alive: true },
        { x: 23 * tile, y: 10.5 * tile, hp: 2, alive: true },
        { x: 30 * tile, y: 11.5 * tile, hp: 2, alive: true });
      questStage = 0;
      message = "Find Elder Rowan by the village road.";
      messageTimer = 4;
      mode = "playing";
      updateCamera();
    }

    function isBlocked(x, y) {
      const tx = Math.floor(x / tile);
      const ty = Math.floor(y / tile);
      return tx < 0 || ty < 0 || tx >= world.width || ty >= world.height || blocked.has(`${tx},${ty}`);
    }

    function moveEntity(entity, dx, dy, radius) {
      const nx = entity.x + dx;
      const ny = entity.y + dy;
      if (!isBlocked(nx - radius, entity.y) && !isBlocked(nx + radius, entity.y)) entity.x = nx;
      if (!isBlocked(entity.x, ny - radius) && !isBlocked(entity.x, ny + radius)) entity.y = ny;
    }

    function near(a, b, distance) {
      return Math.hypot(a.x - b.x, a.y - b.y) < distance;
    }

    function interact() {
      if (questStage === 0 && near(player, guide, 58)) {
        questStage = 1;
        showMessage("Elder Rowan: Dusklings took our Sunstone! Drive them off, then bring it back.");
      } else if (questStage === 1 && near(player, relic, 58)) {
        if (enemies.length > 0) {
          showMessage("The dusklings are still guarding the Sunstone.");
        } else {
          questStage = 2;
          showMessage("You found the Sunstone. Return it to Elder Rowan.");
        }
      } else if (questStage === 2 && near(player, guide, 58)) {
        mode = "won";
        message = "Elder Rowan: The village will see another sunrise. Thank you!";
      } else if (near(player, guide, 58)) {
        showMessage(questStage === 2 ? "Elder Rowan is waiting for the Sunstone." : "Elder Rowan: Follow the road east.");
      } else if (near(player, relic, 58) && questStage < 1) {
        showMessage("A golden light rests on the far end of the road.");
      } else {
        showMessage("There is nothing to interact with here.");
      }
    }

    function attack() {
      if (player.attack > 0) return;
      player.attack = 0.32;
      let hit = false;
      for (let index = enemies.length - 1; index >= 0; index--) {
        const enemy = enemies[index];
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        const facing = player.direction === "left" ? dx < 8 && dx > -62 && Math.abs(dy) < 25
          : player.direction === "right" ? dx > -8 && dx < 62 && Math.abs(dy) < 25
          : player.direction === "up" ? dy < 8 && dy > -62 && Math.abs(dx) < 25
          : dy > -8 && dy < 62 && Math.abs(dx) < 25;
        if (!facing) continue;
        enemy.hp--;
        hit = true;
        if (enemy.hp <= 0) {
          enemies.splice(index, 1);
          player.hp = Math.min(6, player.hp + 1);
          showMessage("Duskling scattered. You recover a little strength.");
        }
      }
      if (!hit) showMessage("Your pulse fades into the air.");
    }

    function showMessage(text) {
      message = text;
      messageTimer = 3.2;
    }

    function questText() {
      if (questStage === 0) return "QUEST  Find Elder Rowan";
      if (questStage === 1) return enemies.length
        ? `QUEST  Drive off the dusklings (${3 - enemies.length}/3)`
        : "QUEST  Take the Sunstone at the end of the road";
      if (questStage === 2) return "QUEST  Return the Sunstone to Elder Rowan";
      return "QUEST  Complete";
    }

    function updateCamera() {
      camera.x = Math.max(0, Math.min(world.width * tile - canvas.width, player.x - canvas.width / 2));
      camera.y = Math.max(0, Math.min(world.height * tile - canvas.height, player.y - canvas.height / 2));
    }

    function update(dt) {
      if (mode !== "playing") return;
      let dx = 0;
      let dy = 0;
      if (keys.has("arrowleft") || keys.has("a")) dx--;
      if (keys.has("arrowright") || keys.has("d")) dx++;
      if (keys.has("arrowup") || keys.has("w")) dy--;
      if (keys.has("arrowdown") || keys.has("s")) dy++;
      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        dx = dx / length * 118 * dt;
        dy = dy / length * 118 * dt;
        player.direction = Math.abs(dx) > Math.abs(dy)
          ? (dx < 0 ? "left" : "right")
          : (dy < 0 ? "up" : "down");
        moveEntity(player, dx, dy, 9);
      }

      player.attack = Math.max(0, player.attack - dt);
      player.hurt = Math.max(0, player.hurt - dt);
      messageTimer = Math.max(0, messageTimer - dt);

      for (const enemy of enemies) {
        const distance = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (distance < 190 && distance > 25) {
          const speed = 34;
          moveEntity(enemy, (player.x - enemy.x) / distance * speed * dt,
            (player.y - enemy.y) / distance * speed * dt, 9);
        } else if (distance < 25 && player.hurt === 0) {
          player.hp--;
          player.hurt = 0.85;
          if (player.hp <= 0) {
            mode = "lost";
            message = "The dusklings drove you back.";
          } else {
            showMessage("A duskling struck you. Keep your distance!");
          }
        }
      }
      updateCamera();
    }

    function drawTile(x, y) {
      const sx = x * tile - camera.x;
      const sy = y * tile - camera.y;
      const road = y >= 9 && y <= 13 && x >= 3 && x <= 40;
      const village = x < 11;
      ctx.fillStyle = road ? (village ? "#9a865e" : "#8a7958")
        : ((x * 7 + y * 13) % 5 === 0 ? "#38644c" : "#315b49");
      ctx.fillRect(sx, sy, tile, tile);
      if (road) {
        ctx.fillStyle = "#aa9568";
        if ((x + y) % 4 === 0) ctx.fillRect(sx + 8, sy + 13, 3, 2);
      } else if ((x * 3 + y * 5) % 7 === 0) {
        ctx.fillStyle = "#6b9a5d";
        ctx.fillRect(sx + 7, sy + 8, 3, 3);
        ctx.fillRect(sx + 22, sy + 23, 2, 3);
      }
    }

    function drawObstacle(x, y) {
      const sx = x * tile - camera.x;
      const sy = y * tile - camera.y;
      ctx.fillStyle = "#263c35";
      ctx.fillRect(sx + 2, sy + 12, 28, 18);
      ctx.fillStyle = "#4e7652";
      ctx.fillRect(sx + 4, sy + 7, 24, 18);
      ctx.fillStyle = "#67905a";
      ctx.fillRect(sx + 9, sy + 3, 14, 15);
      ctx.fillStyle = "#87a461";
      ctx.fillRect(sx + 13, sy + 2, 6, 5);
    }

    function drawCharacter(x, y, color, facing, isPlayer) {
      const sx = Math.round(x - camera.x);
      const sy = Math.round(y - camera.y);
      ctx.fillStyle = "#26352f";
      ctx.fillRect(sx - 8, sy + 5, 16, 10);
      ctx.fillStyle = color;
      ctx.fillRect(sx - 7, sy - 8, 14, 14);
      ctx.fillStyle = isPlayer ? "#f2d1a2" : "#d2bd91";
      ctx.fillRect(sx - 5, sy - 15, 10, 9);
      ctx.fillStyle = "#273431";
      const eyeX = facing === "left" ? -4 : facing === "right" ? 2 : -3;
      ctx.fillRect(sx + eyeX, sy - 12, 2, 2);
      if (isPlayer) {
        ctx.fillStyle = "#e4b852";
        ctx.fillRect(sx - 9, sy - 4, 18, 4);
        if (player.attack > 0.18) {
          ctx.strokeStyle = "#fff0aa";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(sx, sy, 27, 18, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = "#d6ed96";
        ctx.fillRect(sx - 5, sy - 12, 2, 2);
        ctx.fillRect(sx + 3, sy - 12, 2, 2);
      }
    }

    function drawGuide() {
      const x = guide.x - camera.x;
      const y = guide.y - camera.y;
      ctx.fillStyle = "#26352f";
      ctx.fillRect(x - 9, y + 5, 18, 10);
      ctx.fillStyle = "#4f7773";
      ctx.fillRect(x - 8, y - 8, 16, 16);
      ctx.fillStyle = "#e2bd8b";
      ctx.fillRect(x - 6, y - 16, 12, 10);
      ctx.fillStyle = "#26352f";
      ctx.fillRect(x - 3, y - 13, 2, 2);
      ctx.fillRect(x + 2, y - 13, 2, 2);
      ctx.fillStyle = "#c5c1a0";
      ctx.fillRect(x - 8, y - 7, 16, 3);
    }

    function drawRelic() {
      const x = relic.x - camera.x;
      const y = relic.y - camera.y;
      ctx.fillStyle = "#493e2d";
      ctx.fillRect(x - 11, y + 8, 22, 7);
      ctx.fillStyle = "#c89a3c";
      ctx.fillRect(x - 8, y - 4, 16, 14);
      ctx.fillStyle = "#ffe89a";
      ctx.fillRect(x - 4, y - 12, 8, 17);
      ctx.fillStyle = "#fff6c7";
      ctx.fillRect(x - 2, y - 18, 4, 7);
    }

    function drawPanel(x, y, width, height) {
      ctx.fillStyle = "#182624";
      ctx.fillRect(x, y, width, height);
      ctx.strokeStyle = "#9ca889";
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, width - 2, height - 2);
    }

    function wrapMessage(text, maxCharacters) {
      const lines = [];
      let line = "";
      for (const word of text.split(/\s+/)) {
        const next = line ? `${line} ${word}` : word;
        if (next.length > maxCharacters && line) {
          lines.push(line);
          line = word;
        } else {
          line = next;
        }
      }
      if (line) lines.push(line);
      return lines.slice(0, 2);
    }

    function drawTitle() {
      ctx.fillStyle = "#315b49";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < 10; i++) {
        ctx.fillStyle = i % 2 ? "#38644c" : "#416c50";
        ctx.fillRect(i * 72 - 10, 226 + (i % 3) * 12, 76, 140);
      }
      ctx.fillStyle = "#f4d477";
      ctx.textAlign = "center";
      ctx.font = "bold 34px monospace";
      ctx.fillText("THE SUNSTONE TRAIL", 320, 100);
      ctx.fillStyle = "#f4edcc";
      ctx.font = "15px monospace";
      ctx.fillText("A village. A stolen relic. One road through the wilds.", 320, 137);
      camera = { x: 0, y: 0 };
      drawCharacter(320, 218, "#557fa0", "right", true);
      drawCharacter(360, 218, "#4f7773", "left", false);
      ctx.fillStyle = "#f4edcc";
      ctx.fillText("Press Enter to begin", 320, 304);
      ctx.textAlign = "left";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (mode === "title") {
        drawTitle();
        return;
      }

      const startX = Math.floor(camera.x / tile);
      const startY = Math.floor(camera.y / tile);
      for (let y = startY; y <= startY + 12; y++) {
        for (let x = startX; x <= startX + 21; x++) drawTile(x, y);
      }
      for (const [x, y] of obstacles) drawObstacle(x, y);
      drawGuide();
      drawRelic();
      for (const enemy of enemies) drawCharacter(enemy.x, enemy.y, "#695c78", "down", false);

      if (player.hurt > 0 && Math.floor(player.hurt * 12) % 2 === 0) {
        // Blink briefly after taking a hit.
      } else {
        drawCharacter(player.x, player.y, "#557fa0", player.direction, true);
      }

      drawPanel(8, 8, 210, 42);
      ctx.fillStyle = "#f4edcc";
      ctx.font = "13px monospace";
      ctx.fillText("TRAIL RUNNER", 18, 24);
      ctx.fillStyle = "#d87366";
      ctx.fillText("♥".repeat(player.hp) + "·".repeat(6 - player.hp), 18, 42);

      drawPanel(226, 8, 406, 60);
      ctx.fillStyle = "#f2ca70";
      ctx.font = "12px monospace";
      ctx.fillText(questText(), 238, 25);
      ctx.fillStyle = "#f4edcc";
      ctx.font = "10px monospace";
      const lines = wrapMessage(messageTimer > 0 ? message : "Follow the road east.", 56);
      ctx.fillText(lines[0] || "", 238, 42);
      if (lines[1]) ctx.fillText(lines[1], 238, 55);

      const nearGuide = near(player, guide, 62);
      const nearRelic = near(player, relic, 62);
      if ((nearGuide && (questStage === 0 || questStage === 2)) ||
          (nearRelic && questStage === 1 && enemies.length === 0) ||
          (nearRelic && questStage === 1 && enemies.length > 0)) {
        drawPanel(222, 310, 196, 34);
        ctx.fillStyle = "#fff0aa";
        ctx.font = "13px monospace";
        ctx.fillText("E  TALK / INTERACT", 246, 332);
      }

      if (mode === "won" || mode === "lost") {
        ctx.fillStyle = "#101820bb";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawPanel(104, 122, 432, 116);
        ctx.fillStyle = mode === "won" ? "#f2ca70" : "#e3a28b";
        ctx.textAlign = "center";
        ctx.font = "bold 22px monospace";
        ctx.fillText(mode === "won" ? "SUNSTONE RETURNED!" : "THE TRAIL GROWS QUIET", 320, 165);
        ctx.fillStyle = "#f4edcc";
        ctx.font = "15px monospace";
        ctx.fillText("Press Enter to play again", 320, 202);
        ctx.textAlign = "left";
      }
    }

    function frame(time) {
      const dt = Math.min(0.04, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
